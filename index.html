/* 포스터 상자: 비율(1192:1685)을 고정하고 가운데에 놓습니다. 문제 버튼과 아바타는 이 상자 기준으로 위치합니다. */
.frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:1192/1685;width:min(100%,calc(var(--mh,100vh) * 1192 / 1685));background-size:100% 100%}

/* 공통: 사람 아바타 */
.av{position:absolute;transform:translate(-50%,-100%);transition:left 1s linear,top 1s linear;text-align:center;pointer-events:none;z-index:2}
.av.self{transition:left .12s linear,top .12s linear}
.av svg{width:var(--sz);height:calc(var(--sz) * 2);display:block;margin:0 auto;overflow:visible}
.av svg rect,.av svg circle{stroke:var(--ink);stroke-width:2.5}
.av .body,.av .arm{fill:var(--c)}
.av .head{fill:#F6D7B0}
.av .hair{fill:var(--ink);stroke:none}
.av .gl{fill:none;stroke:var(--ink);stroke-width:1.6}
.lkPreview{display:flex;justify-content:center;margin:6px 0 4px;min-height:120px}
.lkAv{position:static;transform:none;transition:none;--sz:84px;text-align:center}
.lkLabel{font-weight:700;font-size:15px;margin:10px 0 4px}
.lkRow{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);box-shadow:none;padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.hb{font-family:var(--body);font-weight:700;font-size:14px;padding:8px 10px;background:var(--paper);color:var(--ink);box-shadow:none;border-radius:10px}
.hb.on{background:var(--yellow)}
.lkGlass{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-weight:700;font-size:15px}
.gbox{background:var(--white);border:4px solid var(--ink);border-radius:20px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.gstate{font-family:var(--display);font-size:20px;margin-bottom:10px;line-height:1.3}
.gstate.running{color:var(--green)}
.gstate.ended{color:var(--bad)}
.gctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gctrl button{font-size:19px;padding:12px 4px}
#bReset{background:#fff}
.gctrl small{display:block;font-family:var(--body);font-size:12px;font-weight:500;margin-top:2px}
.av .leg{fill:var(--ink);stroke:none;transform-box:fill-box;transform-origin:50% 0}
.av .arm{transform-box:fill-box;transform-origin:50% 0}
.av.walk .leg.l,.av.walk .arm.r{animation:swA .45s ease-in-out infinite alternate}
.av.walk .leg.r,.av.walk .arm.l{animation:swB .45s ease-in-out infinite alternate}
@keyframes swA{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes swB{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
.av .nm{display:inline-block;font-weight:700;font-size:14px;background:var(--white);border:2px solid var(--ink);border-radius:99px;padding:0 8px;white-space:nowrap;margin-top:2px}
.av .nm span{font-family:var(--display);font-weight:400;color:var(--pink)}

/* 문제 아이콘 */
/* 문제 표시: 동그라미 없이 굵은 Q 글자만 캐릭터 위에 놓습니다 */
.hot{position:absolute;transform:translate(-50%,-50%);width:auto;height:auto;padding:4px;margin:0;
  background:none;border:none;box-shadow:none;color:var(--ink);
  font-family:var(--display);font-size:34px;font-weight:900;line-height:1;text-align:center;white-space:nowrap;
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff;
  animation:pulse 1.8s ease-in-out infinite;z-index:1;cursor:pointer;user-select:none}
.hot.done{color:#3a7d44;animation:none;opacity:.8}
.hot.tv{pointer-events:none}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}

/* 큰 화면 (TV) */
.tv{display:grid;grid-template-columns:1fr 380px;height:100vh}
.tvmap{position:relative;overflow:hidden;--sz:64px;--mh:100vh}
.tvmap .av .nm{font-size:18px}
.side{display:flex;flex-direction:column;gap:14px;padding:18px;background:rgba(255,253,248,.94);border-left:4px solid var(--ink);overflow:auto}
.qrbox{background:var(--white);border:4px solid var(--ink);border-radius:20px;padding:14px;text-align:center;box-shadow:5px 5px 0 var(--ink)}
.qrbox p{margin:8px 0 0;font-weight:700;font-size:17px}
.stat{font-family:var(--display);font-size:24px}
/* QR: 큰 화면 왼쪽 상단에 띄웁니다 */
.qrfloat{position:absolute;left:18px;top:18px;z-index:5;width:230px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
/* 포스터는 QR 오른쪽 빈 공간의 가운데에 놓습니다 (QR과 겹치지 않도록) */
.tvmap .frame{left:calc(50% + 140px);width:min(calc(100% - 300px),calc(var(--mh,100vh) * 1192 / 1685))}
.qrfloat p{font-size:15px;margin-top:6px}
.qrfloat p small,.howto small{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
.howto{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:2px dashed var(--ink);font-size:13px;line-height:1.4}
.howto li{margin:0 0 7px}
.howto li b{color:var(--ink)}
.board{background:var(--white);border:4px solid var(--ink);border-radius:20px;padding:14px;flex:1;overflow:auto;min-height:0}
.board h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px}
.brow{display:flex;justify-content:space-between;font-size:19px;padding:6px 0;border-bottom:2px dashed #cfc7b4}
.brow b{font-family:var(--display);font-weight:400;color:var(--pink)}
.muted{color:#5a556a;font-size:15px}

/* 참가자 (휴대폰) */
.phone{max-width:480px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
.card{background:var(--white);border:3px solid var(--ink);border-radius:6px 26px 6px 26px;padding:20px;box-shadow:6px 6px 0 var(--ink);margin-bottom:16px}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 10px;line-height:1.2}
.card p{margin:0 0 10px;line-height:1.55}
input[type=text]{width:100%;font-family:var(--body);font-size:18px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);margin:8px 0}
.block{display:block;width:100%;margin-top:10px}
.pmap{position:relative;height:64vh;min-height:360px;overflow:hidden;--sz:44px;--mh:64vh;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);margin-bottom:14px;touch-action:manipulation}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}
.pbar small,.card p small{display:block;font-size:12px;font-weight:600;opacity:.7;margin-top:2px}
.pbar b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--pink)}
.countdown{position:fixed;inset:0;background:rgba(245,239,227,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center}
.cd-num{font-family:var(--display);font-size:150px;line-height:1;color:var(--ink);text-shadow:6px 6px 0 var(--yellow,#FFC93C)}
.countdown p{margin:10px 0 0;font-size:18px;font-weight:700;opacity:.75}
.txt{width:100%;font-size:18px;padding:12px;border:3px solid var(--ink);border-radius:12px;margin-bottom:10px;font-family:inherit;box-sizing:border-box}
.modal{position:fixed;inset:0;background:rgba(31,27,45,.55);display:grid;place-items:center;padding:16px;z-index:9}
.mcard{background:var(--white);border:3px solid var(--ink);border-radius:20px;padding:20px;max-width:440px;width:100%;box-shadow:6px 6px 0 var(--ink)}
.mcard h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;font-family:var(--body);font-weight:700;font-size:17px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);margin-top:10px;padding:14px 16px}
.opt:hover{background:#fff1c7}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#mmsg{min-height:22px;font-weight:700;color:var(--bad);margin:8px 0 0}
.res{font-family:var(--display);font-size:38px;text-align:center;color:var(--green);margin:8px 0}
</style>

let GAME = { status: 'idle', startedAt: null };
let shownStatus = null;      // 참가자 화면에 마지막으로 그린 상태 (같은 상태면 다시 그리지 않음)
const STATE_TEXT = {

  running: '진행 중<br><small>Playing</small>',
  ended: '종료됨<br><small>Ended</small>'
};

async function loadGame() {
  try {
    const { data } = await sb.from('escape_room_state').select('status,started_at').eq('room', ROOM).maybeSingle();
    if (data) GAME = { status: data.status || 'idle', startedAt: data.started_at ? new Date(data.started_at).getTime() : null };
  } catch (e) { /* 실패하면 지금 값을 그대로 씁니다 */ }
  return GAME;
}

async function saveGame(next) {
  const { error } = await sb.from('escape_room_state').upsert({
    room: ROOM,
    status: next.status,
    started_at: next.startedAt ? new Date(next.startedAt).toISOString() : null,
    updated_at: new Date().toISOString()
  });
  if (error) { alert('상태를 저장하지 못했어요: ' + error.message); return; }
  GAME = next;
  ch.send({ type: 'broadcast', event: 'game', payload: GAME });
  applyGameUI();
}

/* 시작: 대기 상태에서 누르면 시간 기록을 이때부터 잽니다. 종료 상태에서 누르면 이어서 합니다. */
function gameStart() {
  const first = GAME.status === 'idle' || !GAME.startedAt;
  saveGame({ status: 'running', startedAt: first ? Date.now() : GAME.startedAt });
}
function gameEnd() {
  saveGame({ status: 'ended', startedAt: GAME.startedAt });
}
/* 리셋: 순위표와 모든 진행 기록을 지우고 대기 상태로 돌립니다. */
async function gameReset() {
  if (!confirm('순위표와 모든 진행 기록을 지웁니다. 계속할까요?\n\nAll records will be cleared. Continue?')) return;
  const { error } = await sb.from('escape_progress').delete().eq('room', ROOM);
  if (error) { alert('기록을 지우지 못했어요: ' + error.message); return; }
  await saveGame({ status: 'idle', startedAt: null });
  ch.send({ type: 'broadcast', event: 'reset', payload: {} });
  loadBoard();
}

/* 걸린 시간: 게임이 시작된 시각과 입장 시각 중 늦은 쪽부터 탈출까지 */
function elapsedMs(row) {
  const from = Math.max(new Date(row.created_at).getTime() || 0, GAME.startedAt || 0);
  return new Date(row.finished_at).getTime() - from;
}

/* 화면 상태 맞추기: 큰 화면은 버튼, 참가자 화면은 진행 화면/대기 화면 */
function applyGameUI() {
  if (MODE === 'display') {
    if (!$('gstate')) return;
    $('gstate').innerHTML = STATE_TEXT[GAME.status] || GAME.status;
    $('gstate').className = 'gstate ' + GAME.status;
    $('bStart').disabled = GAME.status === 'running';
    $('bEnd').disabled = GAME.status !== 'running';
    return;
  }
  if (!me || done || !$('game')) return;
  if (shownStatus === GAME.status) return;
  const prev = shownStatus;
  shownStatus = GAME.status;
  if (GAME.status === 'running') {
    if (prev !== null) startCountdown();
    $('wait').classList.add('hidden');
    $('game').classList.remove('hidden');
  } else {
    $('game').classList.add('hidden');
    $('modal').classList.add('hidden');
    me.paused = false;
    me.walking = false;
    $('wait').innerHTML = GAME.status === 'ended'
      ? '<h2>게임이 끝났어요</h2><p>관리자가 다시 시작하면 이어서 풀 수 있어요.</p>' +
        '<p class="muted">The game is over. It will continue when restarted.</p>'
      : '<h2>곧 시작합니다</h2><p>큰 화면을 봐 주세요. 시작하면 이 화면이 바뀝니다.</p>' +
        '<p class="muted">Starting soon. Please look at the big screen.</p>';
    $('wait').classList.remove('hidden');
  }
}

/* 시작 준비 카운트다운: 3, 2, 1, 시작! 이 끝나야 움직이고 Q를 누를 수 있습니다 */
let countingDown = false;
function startCountdown() {
  const el = $('countdown');
  if (!el) return;
  const steps = ['3', '2', '1', '시작!'];
  const subs = ['Get ready', 'Get ready', 'Get ready', 'Go!'];
  let i = 0;
  countingDown = true;
  el.classList.remove('hidden');
  const show = () => {
    el.innerHTML = '<div class="cd-num">' + steps[i] + '</div><p>' + subs[i] + '</p>';
  };
  show();
  const timer = setInterval(() => {
    i++;
    if (i >= steps.length) {
      clearInterval(timer);
      el.classList.add('hidden');
      countingDown = false;
      return;
    }
    show();
  }, 1000);
}

/* 위치 정보는 브로드캐스트로 받아서 posMap에 모읍니다 (가벼운 메시지).
   접속 입장/퇴장은 presence로 받습니다. 두 가지를 합쳐서 사람 목록을 만듭니다. */
const posMap = {};
function people() {
  const s = ch.presenceState();
  const map = {};
  Object.entries(s).forEach(([pid, metas]) => {
    const m = metas[metas.length - 1];
    if (m && m.name) map[pid] = { pid, ...m };
  });
  const now = Date.now();
  Object.keys(posMap).forEach(pid => {
    const v = posMap[pid];
    if (now - v.t > 10000) { delete posMap[pid]; return; }
    map[pid] = { ...(map[pid] || {}), ...v, pid };
  });
  return Object.values(map).filter(p => p.name);
}

  const hairShort = '<path class="hair" d="M10 12 Q10 1.5 20 1.5 Q30 1.5 30 12 Q26 6 20 6.5 Q14 6 10 12Z"/>';
  const hairLong = '<path class="hair" d="M8 16 Q7 0 20 0 Q33 0 32 16 L32 34 Q28 30 26 27 L14 27 Q12 30 8 34Z"/>';
  const hairBun = hairShort + '<circle class="hair" cx="20" cy="-1" r="5"/>';
  const headBack = hair === 'long' ? hairLong : '';
  const headFront = hair === 'long' ? '' : (hair === 'bun' ? hairBun : hairShort);
  const glasses = look.glasses
    ? '<circle class="gl" cx="16" cy="13" r="3.2"/><circle class="gl" cx="24" cy="13" r="3.2"/><path class="gl" d="M19.2 13 L20.8 13"/>'
    : '';
  return '<svg viewBox="0 0 40 80">' +
    '<rect class="arm l" x="5" y="28" width="7" height="22" rx="3.5"/>' +
    '<rect class="arm r" x="28" y="28" width="7" height="22" rx="3.5"/>' +
    '<rect class="leg l" x="12" y="50" width="7" height="24" rx="3.5"/>' +
    '<rect class="leg r" x="21" y="50" width="7" height="24" rx="3.5"/>' +
    '<rect class="body" x="11" y="26" width="18" height="27" rx="7"/>' +
    headBack +
    '<circle class="head" cx="20" cy="13" r="10.5"/>' +
    headFront + glasses +
    '</svg>';
}

/* 입장 화면에서 고르는 내 모양 */
let look = null;
function loadLook() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('walkLook') || 'null');
    if (saved && saved.color) return saved;
  } catch (e) {}
  return randomLook();
}
function saveLook() {
  try { sessionStorage.setItem('walkLook', JSON.stringify(look)); } catch (e) {}
}
function drawLookPicker() {
  if (!look || !$('lkColor')) return;
  $('lkPreview').innerHTML = '<div class="av lkAv" style="--c:' + look.color + '">' + svgHTML(look) + '</div>';
  $('lkColor').innerHTML = COLORS.map(c =>
    '<button class="sw' + (c === look.color ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '" aria-label="옷 색 ' + c + '"></button>'
  ).join('');
  $('lkHair').innerHTML = Object.keys(HAIR_LABEL).map(h =>
    '<button class="hb' + (h === look.hair ? ' on' : '') + '" data-h="' + h + '">' + HAIR_LABEL[h] + '</button>'
  ).join('');
  $('lkGlasses').checked = !!look.glasses;
  $('lkColor').querySelectorAll('.sw').forEach(b => b.onclick = () => { look.color = b.dataset.c; saveLook(); drawLookPicker(); });
  $('lkHair').querySelectorAll('.hb').forEach(b => b.onclick = () => { look.hair = b.dataset.h; saveLook(); drawLookPicker(); });
}
function initLookPicker() {
  look = loadLook();
  $('lkGlasses').onchange = e => { look.glasses = e.target.checked; saveLook(); drawLookPicker(); };
  $('lkRand').onclick = () => { look = randomLook(); saveLook(); drawLookPicker(); };
  drawLookPicker();
}

/* 모양 무작위 고르기: 다른 사람이 쓰지 않는 색을 우선 고릅니다 */
function randomLook() {
  const used = new Set(people().map(p => p.color));
  const free = COLORS.filter(c => !used.has(c));
  const pool = free.length ? free : COLORS;
  return {
    color: pool[Math.floor(Math.random() * pool.length)],
    hair: ['short', 'long', 'bun'][Math.floor(Math.random() * 3)],
    glasses: Math.random() < 0.3
  };
}

/* 아바타 그리기: 있는 것은 위치만 바꾸고, 없는 것은 새로 만듭니다 */
function drawAvatars(box) {
  const seen = new Set();
  people().forEach(p => {
    if (p.done) return;
    seen.add(p.pid);
    const isSelf = me && p.pid === PKEY;
    let el = box.querySelector('[data-pid="' + p.pid + '"]');
    if (!el) {
      el = document.createElement('div');
      el.className = 'av';
      el.dataset.pid = p.pid;
      el.innerHTML = svgHTML(p) + '<div class="nm"></div>';
      box.appendChild(el);
    }
    el.classList.toggle('self', !!isSelf);
    el.style.setProperty('--c', p.color || COLORS[0]);
    if (!isSelf) {
      el.style.left = p.x + '%';
      el.style.top = p.y + '%';
      el.classList.toggle('walk', !!p.walking);
    }
    el.querySelector('.nm').innerHTML = esc(p.name) + ' <span>' + (p.solved || 0) + '/' + (p.total || 5) + '</span>';
  });
  box.querySelectorAll('.av').forEach(el => { if (!seen.has(el.dataset.pid)) el.remove(); });
}

function drawHot(box, clickable) {
  box.querySelectorAll('.hot').forEach(n => n.remove());
  HOTSPOTS.forEach((h, i) => {
    const b = document.createElement('div');
    b.setAttribute('role', clickable ? 'button' : 'img');
    b.setAttribute('aria-label', '문제 ' + (i + 1));
    const isDone = clickable && solved.includes(i);
    b.className = 'hot' + (isDone ? ' done' : '') + (clickable ? '' : ' tv');
    b.style.left = h.x + '%';
    b.style.top = h.y + '%';
    if (isDone) b.textContent = '✓';
    else b.textContent = 'Q';
    if (clickable) b.onclick = () => goHot(i);
    box.appendChild(b);
  });
}

/* 걸린 시간 = 입장(created_at)부터 탈출(finished_at)까지. 짧을수록 위 */
function fmtMs(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

async function loadBoard() {
  const { data, error } = await sb.from('escape_progress')
    .select('nick,created_at,finished_at')
    .eq('room', ROOM)
    .not('finished_at', 'is', null);
  if (error) return;
  const list = (data || [])
    .map(r => ({ nick: r.nick, ms: elapsedMs(r) }))
    .sort((a, b) => a.ms - b.ms);
  let html = '<h3>탈출 순서 (걸린 시간)</h3>';
  if (!list.length) html += '<div class="muted">아직 탈출한 사람이 없습니다. 게임 시작 후 탈출까지 가장 짧게 걸린 사람이 1등입니다.</div>';
  list.forEach((r, i) => {
    html += '<div class="brow"><span>' + (i + 1) + '등 ' + esc(r.nick || '') + '</span><b>' + fmtMs(r.ms) + '</b></div>';
  });
  $('board').innerHTML = html;
}

/* ================= 참가자 (휴대폰) ================= */
function renderPlayer() {
  $('app').innerHTML = `
  <div class="phone">
    <div id="join" class="card">

      <p>닉네임을 입력하면 아바타가 나타나고 걷기 시작합니다. 화면의 물음표를 누르면 그곳으로 걸어가서 문제를 풉니다.</p>
      <input type="text" id="nick" maxlength="8" placeholder="닉네임 (예: 수어짱)">
      <div class="lkPreview" id="lkPreview"></div>
      <div class="lkLabel">옷 색</div>
      <div class="lkRow" id="lkColor"></div>

      <label class="lkGlass"><input type="checkbox" id="lkGlasses"> 안경 쓰기</label>

        <p class="muted" style="margin:6px 0 0">빈 곳을 누르면 그곳으로 걸어갑니다.<small>Tap an empty spot to walk there</small></p>

  $('bJoin').onclick = join;

    const r = $('pframe').getBoundingClientRect();

function makeQset() {
  // must: true 인 문제는 항상 포함하고, 나머지는 무작위로 채웁니다
  const must = POOL.map((p, i) => (p.must ? i : -1)).filter(i => i >= 0);
  const rest = shuffle(POOL.map((_, i) => i).filter(i => !must.includes(i)));
  const picked = shuffle([...must, ...rest].slice(0, HOT_COUNT));
  return picked.map(qi => ({ qi, order: shuffle([0, 1, 2, 3]) }));
}

async function join() {
  const typed = ($('nick').value || '').trim();
  $('joinMsg').textContent = '';
  let { data: row, error } = await sb.from('escape_progress').select('*').eq('room', ROOM).eq('pid', PID).maybeSingle();
  if (error) { $('joinMsg').textContent = '접속에 문제가 있어요. 다시 눌러 주세요.'; return; }
  if (!row) {
    if (!typed) { $('joinMsg').textContent = '닉네임을 입력해 주세요.'; return; }
    const ins = await sb.from('escape_progress')
      .insert({ room: ROOM, pid: PID, nick: typed, qset: makeQset(), solved_idx: [], solved: 0, total: HOT_COUNT })
      .select().single();
    if (ins.error) { $('joinMsg').textContent = '입장을 저장하지 못했어요. 다시 눌러 주세요.'; return; }
    row = ins.data;
  }
  const name = row.nick || typed || '익명';
  qset = row.qset;
  solved = row.solved_idx || [];
  done = !!row.finished_at;
  me = {
    name, color: look ? look.color : colorOf(PID), hair: look ? look.hair : 'short', glasses: look ? !!look.glasses : false,
    x: rnd(30, 70), y: rnd(30, 70),
    target: null, goal: null, nextPick: Date.now() + 800,
    walking: false, paused: false
  };
  $('join').classList.add('hidden');
  await loadGame();
  if (done) showDone(elapsedMs(row));
  else { shownStatus = null; applyGameUI(); }
  drawPlayer();
  renderConn();
  if (subscribed) sendNow();
  setInterval(tickMe, 100);
}

function drawPlayer() {
  if (!$('pframe')) return;
  drawHot($('pframe'), true);
  drawAvatars($('pframe'));
  $('pcount').textContent = solved.length + ' / ' + HOT_COUNT;
}

function meta() {
  return {
    name: me.name, color: me.color, hair: me.hair, glasses: me.glasses,
    x: Math.round(me.x), y: Math.round(me.y),
    walking: me.walking, solved: solved.length, total: HOT_COUNT, done
  };
}

/* 혼자 걸어 다니는 움직임 */
function tickMe() {
  if (!me || done || me.paused) return;
  // 게임이 진행 중이 아니면 제자리에 서 있습니다 (위치는 계속 알립니다)
  if (GAME.status !== 'running' || countingDown) { me.walking = false; moveSelf(); return; }
  const now = Date.now();
  if (!me.target && now > me.nextPick) {
    me.target = { x: rnd(8, 92), y: rnd(16, 90) };
    me.goal = null;
  }
  me.walking = false;
  if (me.target) {
    const dx = me.target.x - me.x, dy = me.target.y - me.y;
    const d = Math.hypot(dx, dy), step = SPEED * 0.1;
    me.walking = true;
    if (d <= step) {
      me.x = me.target.x; me.y = me.target.y;
      me.target = null;
      me.walking = false;
      me.nextPick = now + rnd(1200, 3000);
      if (me.goal !== null) { const g = me.goal; me.goal = null; openQ(g); }
    } else {
      me.x += dx / d * step; me.y += dy / d * step;
    }
  }
  moveSelf();
  sendMe();
}

function moveSelf() {
  const el = document.querySelector('#pframe [data-pid="' + PKEY + '"]');
  if (!el) return;
  el.style.left = me.x + '%';
  el.style.top = me.y + '%';
  el.classList.toggle('walk', !!me.walking);
}

/* 위치는 브로드캐스트로 보냅니다 (접속 정보 갱신 없이 가볍게) */
function sendPos(force) {
  if (!me || !subscribed) return;
  const key = [Math.round(me.x), Math.round(me.y), me.walking, solved.length, done].join('|');
  if (!force && key === lastKey) return;
  // 사람 한 명이 1초에 2번 이하로만 보내서, 30명이 함께 있어도 초당 메시지 한도(무료 100)를 넘지 않게 합니다
  if (Date.now() - lastSend < 500) return;
  lastKey = key;
  lastSend = Date.now();
  ch.send({ type: 'broadcast', event: 'pos', payload: { ...meta(), pid: PKEY } });
}
function sendMe() { sendPos(false); }

/* 문제 아이콘으로 걸어가기 */
function goHot(i) {
  if (!me || me.paused || done || GAME.status !== 'running' || countingDown || solved.includes(i)) return;
  me.goal = i;
  me.target = { x: HOTSPOTS[i].x, y: HOTSPOTS[i].y + 4 };
}

function openQ(i) {
  if (solved.includes(i)) return;
  me.paused = true;
  currentQ = i;
  const it = qset[i];
  const item = POOL[it.qi];
  $('mq').textContent = item.q;
  $('mvideo').innerHTML = item.video
    ? '<video src="' + esc(item.video) + '" controls playsinline muted preload="auto" style="width:100%;border-radius:12px;border:2px solid #1F1B2D;margin-bottom:8px"></video>'
    : '';
  if (item.type === 'text') {
    // 주관식: 글자를 직접 입력합니다
    $('mopts').innerHTML = '<input id="ans" class="txt" autocomplete="off" placeholder="정답 입력 · Type the answer">' +
      '<button class="opt" id="sendAns">확인 · OK</button>';
    $('sendAns').onclick = () => answerText($('ans').value);
    $('ans').onkeydown = e => { if (e.key === 'Enter') answerText($('ans').value); };
  } else {
    $('mopts').innerHTML = it.order.map((k, ci) =>
      '<button class="opt" data-c="' + ci + '">' + esc(item.c[k]) + '</button>').join('');
    $('mopts').querySelectorAll('.opt').forEach(b => {
      b.onclick = () => answer(Number(b.dataset.c));
    });
  }
  $('mmsg').textContent = '';
  $('modal').classList.remove('hidden');
}

function answer(ci) {
  const it = qset[currentQ];
  const ok = it.order[ci] === POOL[it.qi].a;
  if (!ok) return wrongAnswer();
  correctAnswer();
}

function answerText(v) {
  const norm = t => String(t).replace(/\s+/g, '').toLowerCase();
  const ok = POOL[qset[currentQ].qi].a.map(norm).includes(norm(v));
  if (!ok) return wrongAnswer();
  correctAnswer();
}

function wrongAnswer() {
  $('mmsg').textContent = '아쉬워요. 다시 해 보세요.';
  const m = $('modal').querySelector('.mcard');
  m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
}

function correctAnswer() {
  solved.push(currentQ);
  $('modal').classList.add('hidden');
  me.paused = false;
  drawPlayer();
  saveProgress();
  if (solved.length >= HOT_COUNT) finish();
}

async function saveProgress() {
  await sb.from('escape_progress')
    .update({ solved_idx: solved, solved: solved.length })
    .eq('room', ROOM).eq('pid', PID);
  if (subscribed) ch.track(meta());
}

async function finish() {
  done = true;
  me.paused = true;
  // 탈출 시간은 DB의 입장/탈출 시각 차이로 계산해서 큰 화면과 같은 값을 씁니다
  const { data, error } = await sb.from('escape_progress')
    .update({ finished_at: new Date().toISOString(), solved_idx: solved, solved: solved.length })
    .eq('room', ROOM).eq('pid', PID)
    .select('created_at,finished_at')
    .single();
  const ms = error || !data ? 0 : elapsedMs(data);
  showDone(ms);
  if (subscribed) ch.track(meta());
}

function showDone(ms) {
  done = true;
  $('game').classList.add('hidden');
  $('done').classList.remove('hidden');
  $('done').innerHTML = '<h2>탈출 성공!</h2><div class="res">' + fmtMs(ms) + '</div>' +
    '<p>걸린 시간입니다. 입장부터 탈출까지 시간이 짧을수록 순위가 높아요.<small>This is your time. The shorter the time from entering to escaping, the higher your rank.</small></p>' +
    '<p>문제를 모두 풀었어요. 방을 빠져나왔습니다.<small>You solved all the questions and got out of the room.</small></p>' +
    '<p class="muted">큰 화면의 탈출 순서를 확인해 보세요.<small>Check the escape order on the big screen.</small></p>';
}

/* 리셋 후 참가자: 기록이 지워졌으니 같은 이름으로 다시 등록하고 새 문제를 받습니다 */
async function onReset() {
  if (!me) return;
  solved = []; done = false; currentQ = -1;
  me.goal = null; me.target = null; me.paused = false;
  qset = makeQset();
  const { error } = await sb.from('escape_progress').upsert(
    { room: ROOM, pid: PID, nick: me.name, qset, solved_idx: [], solved: 0, total: HOT_COUNT },
    { onConflict: 'room,pid' });
  if (error) { $('joinMsg') && ($('joinMsg').textContent = '다시 등록하지 못했어요. 새로고침해 주세요.'); }
  $('done').classList.add('hidden');
  $('modal').classList.add('hidden');
  shownStatus = null;
  drawPlayer();
  applyGameUI();
  sendNow();
}

/* ===== 연결 ===== */
ch.on('presence', { event: 'sync' }, () => {
  if (MODE === 'display') drawTV();
  else drawPlayer();
});
ch.on('broadcast', { event: 'game' }, ({ payload }) => {
  if (!payload) return;
  GAME = { status: payload.status || 'idle', startedAt: payload.startedAt || null };
  applyGameUI();
});
ch.on('broadcast', { event: 'reset' }, () => {
  if (MODE === 'player') onReset();
  else loadBoard();
});
ch.on('broadcast', { event: 'pos' }, ({ payload }) => {
  if (!payload || !payload.pid || payload.pid === PKEY) return;
  posMap[payload.pid] = { ...payload, t: Date.now() };
});

if (MODE === 'display') renderTV();
else renderPlayer();

/* 연결 상태 표시 (휴대폰 화면 하단). 입장 전에 연결이 끝나도 나중에 보이도록 값을 기억합니다. */
let connStatus = '연결 확인 중...';
let lastTrack = '';
const STATUS_TEXT = {
  SUBSCRIBED: '연결됨',
  CHANNEL_ERROR: '연결 오류',
  TIMED_OUT: '연결 시간 초과',
  CLOSED: '연결 끊김'
};
function renderConn() {
  const el = $('conn');
  if (el) el.textContent = connStatus + (lastTrack ? ' · 정보 전송: ' + lastTrack : '');
}

let retryCount = 0;
function connect() {
  ch.subscribe((status, err) => {
    connStatus = (STATUS_TEXT[status] || status) + (err ? ' (' + (err.message || err) + ')' : '');
    renderConn();
    if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      subscribed = false;
      // 끊기면 잠시 뒤 다시 연결합니다 (최대 20번)
      if (MODE === 'player' && retryCount < 20) {
        retryCount++;
        setTimeout(() => { connStatus = '다시 연결 중...'; renderConn(); connect(); }, 1500 + retryCount * 500);
      }
      return;
    }
    if (status !== 'SUBSCRIBED') return;
    retryCount = 0;
    subscribed = true;
    // 다시 연결되면 내 정보를 바로 다시 보냅니다. 큰 화면이 나를 다시 찾게 합니다.
    if (me) sendNow();
  });
}
connect();

function sendNow() {
  if (!me) return;
  const p = ch.track(meta());
  if (p && p.then) p.then(r => { lastTrack = String(r); renderConn(); });
}

/* 2초마다 위치를 다시 알립니다 (가벼운 브로드캐스트).
   접속 정보(presence)는 30초마다만 다시 보내서 접속 변화가 쌓이지 않게 합니다. */
setInterval(() => {
  if (MODE === 'player' && subscribed && me) sendPos(true);
}, 2000);
setInterval(() => {
  if (MODE === 'player' && subscribed && me) sendNow();
}, 30000);

/* 휴대폰 화면도 다른 사람들의 움직임을 0.5초마다 갱신 */
setInterval(() => {
  if (MODE === 'player' && me && $('pframe') && !$('game').classList.contains('hidden')) drawAvatars($('pframe'));
}, 500);

/* 참가자 화면은 5초마다 게임 상태를 확인합니다 (방송을 놓쳐도 맞춰집니다) */
setInterval(() => {
  if (MODE === 'player' && me) loadGame().then(applyGameUI);
}, 5000);
</script>
